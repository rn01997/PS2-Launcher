name: Build PS2-Launcher PS1 USB test v10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get PS2-Launcher 4.0.0
        run: |
          git clone --recursive --branch v4.0.0 --depth 1 https://github.com/Irfanlesnar/PS2-Launcher.git src

      - name: Add PS1 USB support
        run: |
          echo '' | base64 -d > /tmp/ps1edit.py
          python3 -m py_compile /tmp/ps1edit.py
          python3 /tmp/ps1edit.py
          cd src
          git diff --check
          git diff -- include/supportbase.h include/system.h src/system.c src/supportbase.c src/ethsupport.c src/bdmsupport.c src/themes.c

      - name: Build with ps2dev container
        run: |
          docker pull ps2dev/ps2dev:latest
          docker run --rm \
            -v "$PWD/src:/src" \
            -w /src \
            ps2dev/ps2dev:latest \
            sh -lc '
              apk add --no-cache build-base git bash curl py3-yaml &&
              export PS2DEV=/usr/local/ps2dev &&
              export PS2SDK=$PS2DEV/ps2sdk &&
              export GSKIT=$PS2DEV/gsKit &&
              export PATH="$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin" &&
              git config --global --add safe.directory /src &&
              if [ ! -d modules/network/lwNBD ]; then
                git clone https://github.com/bignaux/lwNBD.git modules/network/lwNBD &&
                (cd modules/network/lwNBD && git checkout 9777a10f840679ef89b1ec6a588e2d93803d7c37);
              fi &&
              if [ ! -f lang_compiler.py ]; then
                curl -L https://raw.githubusercontent.com/ps2homebrew/Open-PS2-Loader/master/lang_compiler.py -o lang_compiler.py;
              fi &&
              python3 lang_compiler.py --make_header --base lng_tmpl/_base.yml include/lang_autogen.h &&
              python3 lang_compiler.py --make_source --base lng_tmpl/_base.yml src/lang_internal.c &&
              echo "PS2DEV=$PS2DEV" &&
              command -v mips64r5900el-ps2-elf-gcc &&
              command -v make &&
              make -j2 LOCALVERSION=ps1-usb-test
            '

      - name: Collect ELF
        run: |
          mkdir -p out
          if [ -f src/PS2L.ELF ]; then
            cp src/PS2L.ELF out/PS2Launcher_PS1_USB_TEST.ELF
          fi
          if [ -f src/opl.elf ]; then
            cp src/opl.elf out/PS2Launcher_PS1_USB_TEST_unpacked.ELF
          fi
          ls -lah out
          test -n "$(find out -maxdepth 1 -type f -name '*.ELF' -print -quit)"

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: PS2Launcher-PS1-USB-test-v10
          path: out/*.ELF
          if-no-files-found: error
