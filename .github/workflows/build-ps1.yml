          +    int i;
          +    int bands = 16;
          +    int bandHeight = (screenHeight + bands - 1) / bands;
          +    int glowY = 72 + classicBlueWave(gPS5TextureFrame, 360, screenHeight / 3);
          +
          +    /* The original OPL palette used 0x28,0xC5,0xF9 as its default blue.
          +       These bands retain that cyan-blue identity while keeping the PS5-style
          +       layout and its artwork layers untouched. */
          +    for (i = 0; i < bands; i++) {
          +        int r, g, b;
          +
          +        if (i < bands / 2) {
          +            r = 0x04 + (0x0C * i) / (bands / 2);
          +            g = 0x12 + (0x46 * i) / (bands / 2);
          +            b = 0x32 + (0x72 * i) / (bands / 2);
          +        } else {
          +            int t = i - bands / 2;
          +            r = 0x10 - (0x0C * t) / (bands / 2);
          +            g = 0x58 - (0x46 * t) / (bands / 2);
          +            b = 0xA4 - (0x72 * t) / (bands / 2);
          +        }
          +        rmDrawRect(0, i * bandHeight, screenWidth, bandHeight + 1, GS_SETREG_RGBA(r, g, b, 0x80));
          +    }
          +
          +    rmDrawRect(0, glowY, screenWidth, 34, GS_SETREG_RGBA(0x28, 0xC5, 0xF9, 0x08));
