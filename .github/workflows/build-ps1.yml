name: Build PS2-Launcher PS1 USB test v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get PS2-Launcher 4.0.0
        run: |
          git clone --recursive --branch v4.0.0 --depth 1 https://github.com/Irfanlesnar/PS2-Launcher.git src

      - name: Add PS1 USB support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(p):
              return Path("src", p).read_text()

          def write(p, s):
              Path("src", p).write_text(s)

          def rep(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {n}")
              return s.replace(old, new, 1)

          # include/supportbase.h
          p = "include/supportbase.h"
          s = read(p)
          s = rep(
              s,
              '''    GAME_FORMAT_ISO,
};''',
              '''    GAME_FORMAT_ISO,
    GAME_FORMAT_PS1_VCD,
};''',
              "supportbase enum",
          )
          s = rep(
              s,
              "int sbReadList(base_game_info_t **list, const char *prefix, int *fsize, int *gamecount);",
              "int sbReadList(base_game_info_t **list, const char *prefix, int *fsize, int *gamecount, int scanPS1VCDs);",
              "supportbase prototype",
          )
          write(p, s)

          # include/system.h
          p = "include/system.h"
          s = read(p)
          s = rep(
              s,
              "int sysExecElf(const char *path);",
              '''int sysExecElf(const char *path);
int sysExecElfWithArgs(const char *path, int extra_argc, const char *const extra_argv[]);''',
              "system prototype",
          )
          write(p, s)

          # src/system.c
          p = "src/system.c"
          s = read(p)
          old = r'''int sysExecElf(const char *path)
{
    char *argv[1];
    char execPath[256];
    t_ExecData elf;
    int i;

    if (path == NULL || path[0] == '\0')
        return -1;

    for (i = 0; i < (int)sizeof(execPath) - 1 && path[i] != '\0'; i++)
        execPath[i] = path[i];
    execPath[i] = '\0';

    argv[0] = execPath;

    if (SifLoadElf(execPath, &elf) != 0)
        return -1;

    deinit(NO_EXCEPTION, IO_MODE_SELECTED_NONE);
    sysReset(0);

    FlushCache(0);
    FlushCache(2);

    SifLoadFileExit();
    SifExitIopHeap();
    SifExitRpc();

    ExecPS2((void *)elf.epc, (void *)elf.gp, 1, argv);
    return 0;
}'''
          new = r'''#define SYS_EXEC_MAX_EXTRA_ARGS 4
#define SYS_EXEC_ARG_MAX 256

int sysExecElfWithArgs(const char *path, int extra_argc, const char *const extra_argv[])
{
    char *argv[1 + SYS_EXEC_MAX_EXTRA_ARGS];
    char argStorage[SYS_EXEC_MAX_EXTRA_ARGS][SYS_EXEC_ARG_MAX];
    char execPath[256];
    t_ExecData elf;
    int i, argc;

    if (path == NULL || path[0] == '\0')
        return -1;
    if (extra_argc < 0 || extra_argc > SYS_EXEC_MAX_EXTRA_ARGS)
        return -1;
    if (extra_argc > 0 && extra_argv == NULL)
        return -1;

    for (i = 0; i < (int)sizeof(execPath) - 1 && path[i] != '\0'; i++)
        execPath[i] = path[i];
    execPath[i] = '\0';

    argv[0] = execPath;
    argc = 1;

    for (i = 0; i < extra_argc; i++) {
        if (extra_argv[i] == NULL)
            return -1;
        strncpy(argStorage[i], extra_argv[i], SYS_EXEC_ARG_MAX - 1);
        argStorage[i][SYS_EXEC_ARG_MAX - 1] = '\0';
        argv[argc++] = argStorage[i];
    }

    if (SifLoadElf(execPath, &elf) != 0)
        return -1;

    deinit(NO_EXCEPTION, IO_MODE_SELECTED_NONE);
    sysReset(0);

    FlushCache(0);
    FlushCache(2);

    SifLoadFileExit();
    SifExitIopHeap();
    SifExitRpc();

    ExecPS2((void *)elf.epc, (void *)elf.gp, argc, argv);
    return 0;
}

int sysExecElf(const char *path)
{
    return sysExecElfWithArgs(path, 0, NULL);
}'''
          s = rep(s, old, new, "sysExecElf body")
          write(p, s)

          # src/supportbase.c
          p = "src/supportbase.c"
          s = read(p)

          marker = "\nint sbReadList(base_game_info_t **list, const char *prefix, int *fsize, int *gamecount)\n"
          if s.count(marker) != 1:
              raise SystemExit(f"sbReadList marker: found {s.count(marker)}")

          scan_fn = r'''
static int scanForPS1VCD(const char *path, struct game_list_t **glist)
{
    int count = 0;
    DIR *dir;
    struct dirent *dirent;

    dir = opendir(path);
    if (dir == NULL)
        return 0;

    while ((dirent = readdir(dir)) != NULL) {
        size_t len = strlen(dirent->d_name);
        size_t nameLen;
        struct game_list_t *next;
        base_game_info_t *game;

        if (len <= 4 || strcasecmp(&dirent->d_name[len - 4], ".VCD") != 0)
            continue;

        nameLen = len - 4;
        if (nameLen == 0 || nameLen > ISO_GAME_NAME_MAX)
            continue;

        next = malloc(sizeof(struct game_list_t));
        if (next == NULL)
            break;

        memset(next, 0, sizeof(struct game_list_t));
        next->next = *glist;
        *glist = next;
        game = &next->gameinfo;

        memcpy(game->name, dirent->d_name, nameLen);
        game->name[nameLen] = '\0';
        strcpy(game->extension, ".VCD");
        snprintf(game->startup, sizeof(game->startup), "PS1%08X", USBA_crc32(dirent->d_name));

        game->parts = 1;
        game->media = SCECdPS2CD;
        game->format = GAME_FORMAT_PS1_VCD;
        game->sizeMB = 0;
        count++;
    }

    closedir(dir);
    return count;
}
'''
          s = s.replace(marker, "\n" + scan_fn + marker, 1)
          s = rep(
              s,
              "int sbReadList(base_game_info_t **list, const char *prefix, int *fsize, int *gamecount)",
              "int sbReadList(base_game_info_t **list, const char *prefix, int *fsize, int *gamecount, int scanPS1VCDs)",
              "sbReadList signature",
          )

          dvd_block = '''    snprintf(path, sizeof(path), "%sDVD", prefix);
    if ((result = scanForISO(path, SCECdPS2DVD, &dlist_head)) >= 0) {
        count = count < 0 ? result : count + result;
    }
'''
          dvd_new = dvd_block + '''
    if (scanPS1VCDs) {
        snprintf(path, sizeof(path), "%sPOPS", prefix);
        result = scanForPS1VCD(path, &dlist_head);
        if (result >= 0)
            count = count < 0 ? result : count + result;
    }
'''
          s = rep(s, dvd_block, dvd_new, "DVD scan block")

          old_case = '''        case GAME_FORMAT_OLD_ISO:
            snprintf(path, 256, "%s%s%s%s.%s%s", prefix, (game->media == SCECdPS2CD) ? "CD" : "DVD", sep, game->startup, game_name, game->extension);
            break;
'''
          new_case = old_case + '''        case GAME_FORMAT_PS1_VCD:
            snprintf(path, 256, "%sPOPS%s%s%s", prefix, sep, game_name, game->extension);
            break;
'''
          s = rep(s, old_case, new_case, "PS1 path case")

          old_size = '''        snprintf(gamepath, sizeof(gamepath), "%s%s%s%s%s%s", prefix, sep, game->media == SCECdPS2CD ? "CD" : "DVD", sep, game->name, game->extension);
'''
          new_size = '''        if (game->format == GAME_FORMAT_PS1_VCD)
            snprintf(gamepath, sizeof(gamepath), "%sPOPS%s%s%s", prefix, sep, game->name, game->extension);
        else
            snprintf(gamepath, sizeof(gamepath), "%s%s%s%s%s%s", prefix, sep, game->media == SCECdPS2CD ? "CD" : "DVD", sep, game->name, game->extension);
'''
          s = rep(s, old_size, new_size, "config size path")

          old_fmt = '''    if (game->format != GAME_FORMAT_USBLD) {
        if (!strcmp(game->extension, ".iso"))
            configSetStr(config, CONFIG_ITEM_FORMAT, "ISO");
        else if (!strcmp(game->extension, ".zso"))
            configSetStr(config, CONFIG_ITEM_FORMAT, "ZSO");
    } else if (game->format == GAME_FORMAT_USBLD)
        configSetStr(config, CONFIG_ITEM_FORMAT, "UL");

    configSetStr(config, CONFIG_ITEM_MEDIA, game->media == SCECdPS2CD ? "CD" : "DVD");
'''
          new_fmt = '''    if (game->format == GAME_FORMAT_PS1_VCD) {
        configSetStr(config, CONFIG_ITEM_FORMAT, "VCD");
        configSetStr(config, CONFIG_ITEM_MEDIA, "PS1");
    } else {
        if (game->format != GAME_FORMAT_USBLD) {
            if (!strcmp(game->extension, ".iso"))
                configSetStr(config, CONFIG_ITEM_FORMAT, "ISO");
            else if (!strcmp(game->extension, ".zso"))
                configSetStr(config, CONFIG_ITEM_FORMAT, "ZSO");
        } else {
            configSetStr(config, CONFIG_ITEM_FORMAT, "UL");
        }

        configSetStr(config, CONFIG_ITEM_MEDIA, game->media == SCECdPS2CD ? "CD" : "DVD");
    }
'''
          s = rep(s, old_fmt, new_fmt, "config format")
          write(p, s)

          # src/ethsupport.c
          p = "src/ethsupport.c"
          s = read(p)
          s = rep(
              s,
              "sbReadList(&ethGames, ethPrefix, &ethULSizePrev, &ethGameCount)",
              "sbReadList(&ethGames, ethPrefix, &ethULSizePrev, &ethGameCount, 0)",
              "ETH sbReadList call",
          )
          write(p, s)

          # src/bdmsupport.c
          p = "src/bdmsupport.c"
          s = read(p)
          s = rep(
              s,
              "sbReadList(&pDeviceData->bdmGames, pDeviceData->bdmPrefix, &pDeviceData->bdmULSizePrev, &pDeviceData->bdmGameCount)",
              "sbReadList(&pDeviceData->bdmGames, pDeviceData->bdmPrefix, &pDeviceData->bdmULSizePrev, &pDeviceData->bdmGameCount, !strcmp(pDeviceData->bdmDriver, \"usb\"))",
              "BDM sbReadList call",
          )

          launch_marker = '''    } else {
        pDeviceData = gAutoLaunchDeviceData;
        game = gAutoLaunchBDMGame;
    }


    char vmc_name[32], vmc_path[256], have_error = 0;
'''
          launch_new = '''    } else {
        pDeviceData = gAutoLaunchDeviceData;
        game = gAutoLaunchBDMGame;
    }

    if (game->format == GAME_FORMAT_PS1_VCD) {
        char popsLoaderPath[256];
        char gameArg[ISO_GAME_NAME_MAX + ISO_GAME_EXTENSION_MAX + 16];
        const char *args[2];

        if (strcmp(pDeviceData->bdmDriver, "usb") != 0) {
            guiMsgBox("PS1 VCD test supports USB only.", 0, NULL);
            return;
        }

        snprintf(popsLoaderPath, sizeof(popsLoaderPath), "%sAPPS/POPSLOADER.ELF", pDeviceData->bdmPrefix);
        snprintf(gameArg, sizeof(gameArg), "-game=%s%s", game->name, game->extension);

        args[0] = "-page=usb";
        args[1] = gameArg;

        if (sysExecElfWithArgs(popsLoaderPath, 2, args) < 0)
            guiMsgBox("Could not launch APPS/POPSLOADER.ELF.", 0, NULL);
        return;
    }

    char vmc_name[32], vmc_path[256], have_error = 0;
'''
          s = rep(s, launch_marker, launch_new, "PS1 launch branch")
          write(p, s)

          print("PS1 USB source edits applied successfully.")
          PY

          cd src
          git diff --check
          git diff -- include/supportbase.h include/system.h src/system.c src/supportbase.c src/ethsupport.c src/bdmsupport.c

      - name: Build with ps2dev container
        run: |
          docker pull ps2dev/ps2dev:latest
          docker run --rm \
            -v "$PWD/src:/src" \
            -w /src \
            ps2dev/ps2dev:latest \
            sh -lc 'make clean || true; make -j2 LOCALVERSION=ps1-usb-test'

      - name: Collect ELF
        run: |
          mkdir -p out
          if [ -f src/PS2L.ELF ]; then
            cp src/PS2L.ELF out/PS2Launcher_PS1_USB_TEST.ELF
          fi
          if [ -f src/opl.elf ]; then
            cp src/opl.elf out/PS2Launcher_PS1_USB_TEST_unpacked.ELF
          fi
          ls -lah out
          test -n "$(find out -maxdepth 1 -type f -name '*.ELF' -print -quit)"

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: PS2Launcher-PS1-USB-test-v2
          path: out/*.ELF
          if-no-files-found: error
