name: Build PS2 Launcher ELF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile PS2L.ELF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/ps2homebrew/ps2homebrew:main

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compile ELF
        run: |
          set -eu
          make --trace clean
          make --trace all
          test -s PS2L.ELF

      - name: Prepare artifact
        id: artifact
        run: |
          set -eu
          version="$(make oplversion)"
          mkdir -p dist
          cp PS2L.ELF "dist/PS2-Launcher-${version}.ELF"
          sha256sum "dist/PS2-Launcher-${version}.ELF" > dist/SHA256SUMS.txt
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Launcher-${{ steps.artifact.outputs.version }}
          path: |
            dist/*.ELF
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
