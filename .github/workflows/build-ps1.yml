          +static int glassTriangleWave(unsigned int frame, int period, int amplitude)
          +{
          +    int phase = frame % period;
          +
          +    if (phase > period / 2)
          +        phase = period - phase;
          +
          +    return (phase * amplitude * 2) / period;
          +}
