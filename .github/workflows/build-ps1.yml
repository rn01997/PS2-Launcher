name: Build PS2-Launcher PS1 USB test v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get PS2-Launcher 4.0.0
        run: |
          git clone --recursive --branch v4.0.0 --depth 1 https://github.com/Irfanlesnar/PS2-Launcher.git src

      - name: Add PS1 USB support
        run: |
          echo '' | base64 -d > /tmp/ps1edit.py
          python3 /tmp/ps1edit.py
          cd src
          git diff --check
          git diff -- include/supportbase.h include/system.h src/system.c src/supportbase.c src/ethsupport.c src/bdmsupport.c

      - name: Build with ps2dev container
        run: |
          docker pull ps2dev/ps2dev:latest
          docker run --rm \
            -v "$PWD/src:/src" \
            -w /src \
            ps2dev/ps2dev:latest \
            sh -lc 'make clean || true; make -j2 LOCALVERSION=ps1-usb-test'

      - name: Collect ELF
        run: |
          mkdir -p out
          if [ -f src/PS2L.ELF ]; then
            cp src/PS2L.ELF out/PS2Launcher_PS1_USB_TEST.ELF
          fi
          if [ -f src/opl.elf ]; then
            cp src/opl.elf out/PS2Launcher_PS1_USB_TEST_unpacked.ELF
          fi
          ls -lah out
          test -n "$(find out -maxdepth 1 -type f -name '*.ELF' -print -quit)"

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: PS2Launcher-PS1-USB-test-v3
          path: out/*.ELF
          if-no-files-found: error
